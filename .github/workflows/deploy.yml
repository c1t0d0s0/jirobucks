name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure Google Analytics
        env:
          GA_ID: ${{ vars.GA_ID || secrets.GA_ID }}
        run: |
          if [ -n "$GA_ID" ]; then
            echo "Google Analytics ID found: configuring $GA_ID"
            
            # 1. Generate config.js
            echo "const GTM_ID = '$GA_ID';" > config.js

            # 2. Inject Google tag directly into index.html
            node -e '
              const fs = require("fs");
              const gaId = process.env.GA_ID.trim();
              const snippet = `  <!-- Google tag (gtag.js) -->\n  <script async src="https://www.googletagmanager.com/gtag/js?id=${gaId}"></script>\n  <script>\n    window.dataLayer = window.dataLayer || [];\n    function gtag(){dataLayer.push(arguments);}\n    gtag("js", new Date());\n    gtag("config", "${gaId}");\n  </script>\n`;
              let html = fs.readFileSync("index.html", "utf8");
              if (html.includes("<head>")) {
                html = html.replace("<head>", "<head>\n" + snippet);
                fs.writeFileSync("index.html", html, "utf8");
                console.log("Successfully embedded Google Analytics tag into index.html");
              } else {
                console.warn("Warning: <head> tag not found in index.html");
              }
            '
          else
            echo "vars.GA_ID is not set. Generating empty config.js..."
            echo "const GTM_ID = '';" > config.js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
